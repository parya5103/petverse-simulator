<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#87ceeb">
  <meta name="description" content="PetVerse: The Lost Starseed - a mobile-first 3D virtual pet browser game. Restore the island's glow.">
  <title>PetVerse: The Lost Starseed</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="topbar">
      <div id="brand">PetVerse</div>
      <div id="topbar-right">
        <div id="level-chip">Lv <span id="level">1</span></div>
        <div id="light-chip">
          <span id="light-label">Light</span>
          <div id="light-bar"><div id="light-fill"></div></div>
          <span id="light-pct">0%</span>
        </div>
        <div id="coin-chip"><span id="coins">0</span> coins</div>
        <button id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="5" cy="12" r="2"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <circle cx="19" cy="12" r="2"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div id="bottom-stack">
      <div id="feedback-layer"></div>

      <div id="stat-panel">
        <div class="stat">
          <span class="stat-label">Hunger</span>
          <div class="bar"><div class="bar-fill hunger" id="bar-hunger"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Happiness</span>
          <div class="bar"><div class="bar-fill happiness" id="bar-happiness"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Energy</span>
          <div class="bar"><div class="bar-fill energy" id="bar-energy"></div></div>
        </div>
      </div>

      <div id="nav-bar">
        <button id="btn-shop">Egg Shop</button>
        <button id="btn-pets">Spirits</button>
        <button id="btn-islands">Islands</button>
      </div>

      <div id="action-bar">
        <button id="btn-feed">Feed</button>
        <button id="btn-play">Play</button>
        <button id="btn-clean">Clean</button>
      </div>

      <div id="toasts"></div>
    </div>
  </div>

  <div id="settings-sheet" class="sheet" hidden>
    <div id="settings-card" class="sheet-card">
      <h2>Settings</h2>
      <button id="toggle-mute">Sound: On</button>
      <button id="toggle-reduced">Reduced Motion: Off</button>
      <button id="btn-close-settings" class="sheet-close">Close</button>
    </div>
  </div>

  <div id="shop-sheet" class="sheet" hidden>
    <div id="shop-card" class="sheet-card">
      <h2>Egg Shop</h2>
      <div id="shop-cards"></div>
      <button id="btn-close-shop" class="sheet-close">Close</button>
    </div>
  </div>

  <div id="pets-sheet" class="sheet" hidden>
    <div id="pets-card" class="sheet-card">
      <h2>Spirit Collection</h2>
      <div id="pets-cards"></div>
      <button id="btn-close-pets" class="sheet-close">Close</button>
    </div>
  </div>

  <div id="intro-overlay" hidden>
    <div id="intro-card">
      <div id="intro-kicker">PetVerse: The Lost Starseed</div>
      <h2 id="intro-title"></h2>
      <p id="intro-text"></p>
      <div id="intro-actions">
        <button id="intro-skip">Skip</button>
        <button id="intro-next">Next</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>

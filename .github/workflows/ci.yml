name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check ES modules
        run: |
          set -e
          for f in $(find src -name "*.js"); do
            node --check "$f"
          done
          echo "All JS files parsed OK"
